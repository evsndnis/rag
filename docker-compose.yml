networks:
  rag-net:
    name: rag-net
    external: false

services:
  app:                              # имя сервиса
    build: .                        # собирать из Dockerfile в текущей папке
    image: rag-service:latest       # имя собранного образа; latest — стандартный тег "самая свежая"
    container_name: rag-service     # фиксированное имя контейнера, чтобы было удобно адресовать в docker logs/stop
    ports:
      - "8001:8000"                 # слева — порт ноутбука, справа — порт внутри контейнера
    env_file:
      - .env
    networks:
      - rag-net
    depends_on:
      - qdrant
    restart: unless-stopped         # если контейнер упал — Docker сам перезапустит (но не если вы остановили его руками)

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - rag-net
    restart: unless-stopped